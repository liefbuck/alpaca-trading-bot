<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:24px}
    h1{font-size:1.3rem;font-weight:700;color:#58a6ff;margin-bottom:20px}
    h2{font-size:.8rem;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
    .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:18px}
    .card .label{font-size:.7rem;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    .card .value{font-size:1.5rem;font-weight:700}
    .card .sub{font-size:.7rem;color:#8b949e;margin-top:4px}
    .green{color:#3fb950}.red{color:#f85149}.blue{color:#58a6ff}.muted{color:#8b949e}.yellow{color:#d29922}
    .section{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:20px}
    .progress-wrap{margin:12px 0}
    .progress-bar-bg{background:#21262d;border-radius:999px;height:10px;overflow:hidden}
    .progress-bar{height:10px;border-radius:999px;transition:width .5s}
    .progress-label{font-size:.75rem;color:#8b949e;margin-top:5px;display:flex;justify-content:space-between}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th{color:#8b949e;font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid #21262d}
    td{padding:8px 10px;border-bottom:1px solid #21262d}
    td:last-child,th:last-child{text-align:right}
    td:nth-child(2),th:nth-child(2),td:nth-child(3),th:nth-child(3),td:nth-child(4),th:nth-child(4),td:nth-child(5),th:nth-child(5){text-align:right}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-weight:600;letter-spacing:.03em}
    .badge-closed{background:#1c2a1c;color:#3fb950;border:1px solid #2a4a2a}
    .badge-open{background:#1a2233;color:#58a6ff;border:1px solid #1f3a5f}
    .refresh-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    button{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:.82rem}
    button:hover{background:#30363d}
    #lastUpdated{font-size:.75rem;color:#8b949e}
    .err{color:#f85149;font-size:.8rem;padding:10px}
    .divider{border:none;border-top:1px solid #21262d;margin:14px 0}
    .log-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .log-box{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:12px;font-family:monospace;font-size:.68rem;color:#8b949e;height:200px;overflow-y:auto;white-space:pre-wrap}
    .log-label{font-size:.7rem;color:#8b949e;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
    .limits-row{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:#8b949e;margin-top:8px}
    .limits-row span{padding:2px 10px;background:#21262d;border-radius:4px}
    @media(max-width:600px){.log-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<h1>Trading Dashboard</h1>
<div class="refresh-bar">
  <span id="lastUpdated">Loading…</span>
  <button onclick="load()">&#8635; Refresh</button>
</div>
<div id="root"><div style="color:#8b949e;padding:20px">Connecting…</div></div>

<script>
const KEY    = "PKK4I3B42JELVTO3CQRKWPMGCA";
const SECRET = "HnCpNiFnpmriwDuQWp4hkDPs9bC4TNNtox6C2YoznY8b";
const TRADE_URL = "https://paper-api.alpaca.markets/v2";
const DATA_URL  = "https://data.alpaca.markets/v2";

const headers = { "APCA-API-KEY-ID": KEY, "APCA-API-SECRET-KEY": SECRET };

async function apca(url) {
  const r = await fetch(url, { headers });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function getTodayOrders() {
  const today = new Date(); today.setHours(0,0,0,0);
  try {
    const orders = await apca(`${TRADE_URL}/orders?status=all&after=${today.toISOString()}&limit=100&direction=desc`);
    return orders.filter(o => o.status === "filled" || o.status === "partially_filled");
  } catch { return []; }
}

async function getBars(symbol) {
  const end   = new Date().toISOString();
  const start = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  try {
    const d = await apca(`${DATA_URL}/stocks/${symbol}/bars?timeframe=1Day&start=${start}&end=${end}&limit=40&feed=iex`);
    return (d.bars || []).map(b => ({ date: b.t.slice(0,10), close: b.c }));
  } catch { return []; }
}

async function getLogs() {
  try { return await fetch("/logs").then(r => r.json()); }
  catch { return { momentum: [], mean_reversion: [] }; }
}

async function getConfig() {
  try { return await fetch("/config").then(r => r.json()); }
  catch { return { daily_target: 200, daily_loss_limit: -300, per_position_stop: -150, per_position_target: 20, max_positions: 10, session_baseline: null }; }
}

async function getPerformance() {
  try { return await fetch("/performance").then(r => r.json()); }
  catch { return []; }
}

const nameCache = {};
async function getNames(symbols) {
  const missing = symbols.filter(s => !nameCache[s]);
  await Promise.all(missing.map(async s => {
    try {
      const a = await apca(`${TRADE_URL}/assets/${s}`);
      nameCache[s] = a.name || s;
    } catch { nameCache[s] = s; }
  }));
  return nameCache;
}

async function load() {
  try {
    const [account, positions, orders, logs, cfg, perf] = await Promise.all([
      apca(`${TRADE_URL}/account`),
      apca(`${TRADE_URL}/positions`),
      getTodayOrders(),
      getLogs(),
      getConfig(),
      getPerformance(),
    ]);
    const chartSymbol = positions.length ? positions[0].symbol : null;
    const allSymbols  = [...new Set([...positions.map(p => p.symbol), ...orders.map(o => o.symbol)])];
    const [bars, names] = await Promise.all([
      chartSymbol ? getBars(chartSymbol) : Promise.resolve([]),
      getNames(allSymbols),
    ]);
    render(account, positions, orders, bars, logs, cfg, chartSymbol, perf, names);
    document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById("root").innerHTML = `<div class="err">Error: ${e.message}</div>`;
  }
}

const fmt  = (n, d=2) => Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const sign = n => n >= 0 ? "+" : "";
const plColor = n => n > 0 ? "green" : n < 0 ? "red" : "muted";

function progressBar(pnl, totalRealized, cfg) {
  const { daily_target: TARGET, daily_loss_limit: LOSS_LIMIT } = cfg;
  const range = TARGET - LOSS_LIMIT;
  const pct   = Math.min(100, Math.max(0, (pnl - LOSS_LIMIT) / range * 100));
  const color  = pnl >= TARGET ? "#3fb950" : pnl <= LOSS_LIMIT ? "#f85149" : "#58a6ff";
  const realizedStr = totalRealized !== 0 ? ` (${sign(totalRealized)}$${fmt(totalRealized)} realized)` : "";
  return `
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar" style="width:${pct}%;background:${color}"></div></div>
      <div class="progress-label">
        <span>Loss limit &minus;$${Math.abs(LOSS_LIMIT)}</span>
        <span><b>${sign(pnl)}$${fmt(pnl)}</b>${realizedStr}</span>
        <span>Target +$${TARGET}</span>
      </div>
    </div>`;
}

function calcRealizedPnl(orders) {
  // Sort all orders chronologically, then FIFO-match each sell to the buys
  // that were actually open at that moment. This correctly handles symbols
  // that were bought and sold multiple times in one day.
  const bySymbol = {};
  for (const o of orders) {
    if (!bySymbol[o.symbol]) bySymbol[o.symbol] = [];
    bySymbol[o.symbol].push(o);
  }

  let totalRealized = 0;
  const byOrderId   = {};   // P&L keyed by sell order ID (for the trades table)
  const bySymbolSum = {};   // cumulative P&L per symbol (for summary)

  for (const [sym, symOrders] of Object.entries(bySymbol)) {
    symOrders.sort((a,b) => new Date(a.filled_at) - new Date(b.filled_at));
    const buyQueue = [];   // [{price, qty}]
    bySymbolSum[sym] = 0;

    for (const o of symOrders) {
      const qty   = parseFloat(o.filled_qty);
      const price = parseFloat(o.filled_avg_price);
      if (o.side === "buy") {
        buyQueue.push({ price, qty });
      } else {
        let remaining = qty, pl = 0;
        while (remaining > 0 && buyQueue.length) {
          const lot     = buyQueue[0];
          const matched = Math.min(remaining, lot.qty);
          pl           += (price - lot.price) * matched;
          lot.qty      -= matched;
          remaining    -= matched;
          if (lot.qty <= 0) buyQueue.shift();
        }
        byOrderId[o.id]  = pl;
        bySymbolSum[sym] += pl;
        totalRealized    += pl;
      }
    }
  }
  return { totalRealized, byOrderId, bySymbolSum };
}

let chartInstance = null;

function render(account, positions, orders, bars, logs, cfg, chartSymbol, perf = [], names = {}) {
  const { daily_target: TARGET, daily_loss_limit: LOSS_LIMIT,
          per_position_stop: PER_STOP, per_position_target: PER_TARGET,
          session_baseline } = cfg;

  const equity      = parseFloat(account.equity);
  const lastEquity  = parseFloat(account.last_equity);
  const baseline    = session_baseline || lastEquity;
  const dailyPnl    = equity - baseline;
  const buyingPower = parseFloat(account.buying_power);

  const { totalRealized, byOrderId, bySymbolSum } = calcRealizedPnl(orders);

  // ── Account Overview ─────────────────────────────────────────────────────
  let html = `
  <div class="section">
    <h2>Account Overview</h2>
    ${progressBar(dailyPnl, totalRealized, cfg)}
    <div class="limits-row">
      <span>Daily limit: &minus;$${Math.abs(LOSS_LIMIT)}</span>
      <span>Per-position stop: &minus;$${Math.abs(PER_STOP)}</span>
      <span>Per-position target: +$${PER_TARGET}</span>
      ${session_baseline ? `<span style="color:#d29922">Baseline reset: $${fmt(session_baseline)}</span>` : ""}
    </div>
    <div class="grid" style="margin-top:16px">
      <div class="card">
        <div class="label">Session P&amp;L</div>
        <div class="value ${plColor(dailyPnl)}">${sign(dailyPnl)}$${fmt(dailyPnl)}</div>
        ${session_baseline ? `<div class="sub">From reset baseline</div>` : ""}
      </div>
      <div class="card">
        <div class="label">Realized Today</div>
        <div class="value ${plColor(totalRealized)}">${sign(totalRealized)}$${fmt(totalRealized)}</div>
      </div>
      <div class="card">
        <div class="label">Portfolio Value</div>
        <div class="value">$${fmt(equity)}</div>
      </div>
      <div class="card">
        <div class="label">Buying Power</div>
        <div class="value">$${fmt(buyingPower)}</div>
      </div>
    </div>
  </div>`;

  // ── Open Positions ────────────────────────────────────────────────────────
  html += `<div class="section"><h2>Open Positions</h2>`;
  if (positions.length) {
    html += `<table>
      <tr>
        <th>Symbol</th><th>Qty</th><th>Entry</th><th>Current</th><th>Mkt Value</th>
        <th>Unrealized P&amp;L</th><th>To Target</th><th>Stop Room</th>
      </tr>`;
    for (const p of positions) {
      const pl      = parseFloat(p.unrealized_pl);
      const plpc    = parseFloat(p.unrealized_plpc) * 100;
      const toTarget = PER_TARGET - pl;
      const stopRoom = pl - PER_STOP;
      const stopColor = stopRoom < 20 ? "red" : stopRoom < 60 ? "yellow" : "muted";
      html += `<tr>
        <td class="blue"><b>${p.symbol}</b> <span style="font-size:.75rem;color:#8b949e;font-weight:400">${names[p.symbol] || ""}</span></td>
        <td>${p.qty}</td>
        <td>$${fmt(parseFloat(p.avg_entry_price))}</td>
        <td>$${fmt(parseFloat(p.current_price))}</td>
        <td>$${fmt(parseFloat(p.market_value))}</td>
        <td class="${plColor(pl)}">${sign(pl)}$${fmt(pl)} <span style="font-size:.75rem">(${sign(plpc)}${fmt(plpc)}%)</span></td>
        <td class="${toTarget <= 0 ? "green" : "muted"}">${toTarget <= 0 ? "&#10003; Hit" : "$" + fmt(toTarget) + " away"}</td>
        <td class="${stopColor}">$${fmt(stopRoom)} left</td>
      </tr>`;
    }
    html += `</table>`;
  } else {
    html += `<div style="color:#8b949e;padding:10px 0">No open positions.</div>`;
  }

  // ── Today's Trades ────────────────────────────────────────────────────────
  html += `<hr class="divider"/><h2 style="margin-top:4px">Today's Trades</h2>`;
  const displayOrders = [...orders].sort((a,b) => new Date(b.filled_at) - new Date(a.filled_at));
  if (displayOrders.length) {
    html += `<table>
      <tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Fill Price</th><th>Value</th><th>P&amp;L</th></tr>`;
    for (const o of displayOrders) {
      const time   = new Date(o.filled_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
      const price  = parseFloat(o.filled_avg_price);
      const qty    = parseFloat(o.filled_qty);
      const isSell = o.side === "sell";
      const sideLabel = isSell
        ? `<span class="badge badge-closed">SELL</span>`
        : `<span class="badge badge-open">BUY</span>`;
      let plCell = `<span class="muted">—</span>`;
      if (isSell && byOrderId[o.id] !== undefined) {
        const pl = byOrderId[o.id];
        plCell = `<span class="${plColor(pl)}">${sign(pl)}$${fmt(pl)}</span>`;
      }
      html += `<tr>
        <td class="muted">${time}</td>
        <td class="blue"><b>${o.symbol}</b> <span style="font-size:.75rem;color:#8b949e;font-weight:400">${names[o.symbol] || ""}</span></td>
        <td>${sideLabel}</td>
        <td>${qty}</td>
        <td>$${fmt(price)}</td>
        <td>$${fmt(price*qty)}</td>
        <td>${plCell}</td>
      </tr>`;
    }
    html += `</table>`;
  } else {
    html += `<div style="color:#8b949e;padding:10px 0">No trades yet today.</div>`;
  }
  html += `</div>`;

  // ── Bot Logs ──────────────────────────────────────────────────────────────
  const momLog = (logs.momentum      || []).join("\n") || "No momentum log yet.";
  const mrLog  = (logs.mean_reversion || []).join("\n") || "No mean reversion log yet.";
  html += `
  <div class="section">
    <h2>Bot Activity</h2>
    <div class="log-grid">
      <div>
        <div class="log-label">&#9650; Momentum Bot</div>
        <div class="log-box" id="logMom">${momLog}</div>
      </div>
      <div>
        <div class="log-label">&#8635; Mean Reversion Bot</div>
        <div class="log-box" id="logMR">${mrLog}</div>
      </div>
    </div>
  </div>`;

  // ── Daily Performance History ─────────────────────────────────────────────
  const sorted = [...perf].sort((a,b) => b.date.localeCompare(a.date));
  const totalPnl   = perf.reduce((s,d) => s + d.daily_pnl, 0);
  const winDays    = perf.filter(d => d.daily_pnl > 0).length;
  const totalDays  = perf.length;
  const avgDaily   = totalDays ? totalPnl / totalDays : 0;

  html += `<div class="section"><h2>Daily Performance History</h2>`;
  if (sorted.length) {
    html += `
    <div class="grid" style="margin-bottom:16px">
      <div class="card">
        <div class="label">Total P&amp;L</div>
        <div class="value ${plColor(totalPnl)}">${sign(totalPnl)}$${fmt(totalPnl)}</div>
      </div>
      <div class="card">
        <div class="label">Win Days</div>
        <div class="value">${winDays} / ${totalDays}</div>
        <div class="sub">${totalDays ? (winDays/totalDays*100).toFixed(0) : 0}% win rate</div>
      </div>
      <div class="card">
        <div class="label">Avg Daily P&amp;L</div>
        <div class="value ${plColor(avgDaily)}">${sign(avgDaily)}$${fmt(avgDaily)}</div>
      </div>
      <div class="card">
        <div class="label">vs Poker ($100/day)</div>
        <div class="value ${plColor(totalPnl - totalDays*100)}">${sign(totalPnl - totalDays*100)}$${fmt(totalPnl - totalDays*100)}</div>
        <div class="sub">Bot vs $${(totalDays*100).toFixed(0)} poker target</div>
      </div>
    </div>
    <table>
      <tr><th>Date</th><th>Result</th><th>Daily P&amp;L</th><th>Trades</th><th>Win Rate</th><th>Best Trade</th><th>Worst Trade</th></tr>`;
    for (const d of sorted) {
      const rc = d.daily_pnl > 0 ? "green" : "red";
      html += `<tr>
        <td class="muted">${d.date}</td>
        <td><span class="badge ${d.result === 'WIN' ? 'badge-closed' : 'badge-stop'}">${d.result}</span></td>
        <td class="${rc}"><b>${sign(d.daily_pnl)}$${fmt(d.daily_pnl)}</b></td>
        <td>${d.trades}</td>
        <td>${d.win_rate}%</td>
        <td class="green">+$${fmt(d.best_trade)}</td>
        <td class="red">$${fmt(d.worst_trade)}</td>
      </tr>`;
    }
    html += `</table>`;
  } else {
    html += `<div style="color:#8b949e;padding:10px 0">No completed trading days recorded yet. History is saved automatically at 3:45 PM each day.</div>`;
  }
  html += `</div>`;

  // ── Price Chart (first open position) ────────────────────────────────────
  if (bars.length && chartSymbol) {
    html += `<div class="section"><h2>${chartSymbol} — 30-Day Price Chart</h2><canvas id="chart" height="90"></canvas></div>`;
  }

  document.getElementById("root").innerHTML = html;
  ["logMom","logMR"].forEach(id => { const el = document.getElementById(id); if (el) el.scrollTop = el.scrollHeight; });

  if (bars.length && chartSymbol) {
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById("chart").getContext("2d"), {
      type: "line",
      data: {
        labels: bars.map(b => b.date),
        datasets: [{
          label: "Close",
          data: bars.map(b => b.close),
          borderColor: "#58a6ff",
          backgroundColor: "rgba(88,166,255,0.08)",
          tension: .3, pointRadius: 2, fill: true,
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8b949e", maxTicksLimit: 10 }, grid: { color: "#21262d" } },
          y: { ticks: { color: "#8b949e", callback: v => "$" + v.toFixed(2) }, grid: { color: "#21262d" } }
        }
      }
    });
  }
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
